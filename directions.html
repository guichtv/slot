<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOOMTOOTH — Directions artistiques</title>
<style>
  :root { --ink: #1b1410; --cream: #f4e6c8; --orange: #e8742a; --gold: #f2b233; --bg: #221a16; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font: 16px/1.45 system-ui, sans-serif; }
  header { padding: 24px 20px 8px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .04em; }
  header p { margin: 0; opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 18px; padding: 16px 20px 40px; }
  figure { margin: 0; background: #2e241e; border-radius: 16px; overflow: hidden; border: 2px solid #3b2e26; }
  figure.chosen { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,178,51,.25); }
  figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  figcaption { padding: 12px 14px 14px; }
  figcaption b { color: var(--gold); }
  .tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 99px; background: var(--orange); color: var(--ink); font-size: 12px; font-weight: 700; }
  #viewer { position: fixed; inset: 0; background: rgba(10,8,6,.94); display: none; overflow: auto; cursor: zoom-out; }
  #viewer.on { display: block; }
  #viewer img { display: block; margin: 0 auto; max-width: 100vw; max-height: 100vh; }
  #viewer.zoom img { max-width: none; max-height: none; width: 200%; }
  #viewer .hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<header>
  <h1>BOOMTOOTH — cinq directions artistiques</h1>
  <p>Maquettes ImageGen 1536 × 1024. Clic : plein écran ; second clic : zoom ×2 ; Échap : fermer. Choix et notation : docs/ART-DIRECTION.md.</p>
</header>
<main class="grid" id="grid"></main>
<div id="viewer"><img alt=""><div class="hint">clic : zoom · Échap : fermer</div></div>
<script>
const D = [
  ['D1', 'Carrière à l\'heure dorée', 'Fin d\'après-midi orangée, montagne à moitié sculptée, barrage et chute d\'eau, cadre en poutres boulonnées.', 'retenue'],
  ['D2', 'Affiche de bûcheron pop', 'Aplats sérigraphiés, trame de points, grille-caisse en bois clair.', ''],
  ['D3', 'Dynamitage de nuit', 'Aurore boréale, projecteurs, cadre de wagonnet riveté.', 'ambiance bonus'],
  ['D4', 'Chantier du barrage à midi', 'Plein soleil, diagonale dynamique, grue en rondins, cadre ligoté.', ''],
  ['D5', 'Atelier creusé dans le granit', 'Caverne-atelier, filons d\'or, arche sur la montagne.', ''],
];
const grid = document.getElementById('grid');
for (const [id, name, intent, tag] of D) {
  const f = document.createElement('figure');
  if (tag === 'retenue') f.className = 'chosen';
  f.innerHTML = `<img src="assets/generated/directions/${id}.png" alt="${id} ${name}" loading="lazy"><figcaption><b>${id} — ${name}</b>${tag ? `<span class="tag">${tag}</span>` : ''}<br>${intent}</figcaption>`;
  grid.append(f);
}
const v = document.getElementById('viewer');
const vi = v.querySelector('img');
grid.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img) return;
  vi.src = img.src;
  v.className = 'on';
});
v.addEventListener('click', () => { v.classList.contains('zoom') ? (v.className = '') : v.classList.add('zoom'); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') v.className = ''; });
</script>
</body>
</html>
